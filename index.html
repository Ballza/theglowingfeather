<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Glowing Feather | Hand-Raised Cockatiels</title>
<meta name="description" content="The Glowing Feather — hand-raised cockatiels. Website coming soon.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf2e8;
    --cream-deep: #f3e4d0;
    --gold: #b5832e;
    --gold-soft: #d6a95a;
    --ink: #7a5a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background: radial-gradient(ellipse at 50% 40%, #fffaf3 0%, var(--cream) 45%, var(--cream-deep) 100%);
    color: var(--ink);
    font-family: "Montserrat", system-ui, sans-serif;
    overflow-x: hidden;
  }
  main {
    text-align: center;
    max-width: 640px;
    width: 100%;
    animation: fadeUp 1.4s ease-out both;
  }
  .emblem {
    position: relative;
    width: min(340px, 78vw);
    margin: 0 auto 28px;
  }
  .emblem img { width: 100%; height: auto; display: block; }
  /* soft pulse where the feather meets the circle */
  .emblem::after {
    content: "";
    position: absolute;
    left: 40%; bottom: 8%;
    width: 22%; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,130,.55) 0%, rgba(255,214,130,0) 70%);
    transform: translate(-50%, 50%);
    animation: glow 4s ease-in-out infinite;
    pointer-events: none;
  }
  h1 {
    font-family: "Cormorant SC", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 7.5vw, 3.4rem);
    letter-spacing: .08em;
    color: var(--gold);
    line-height: 1.1;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(420px, 90%);
    margin: 14px auto 12px;
    color: var(--gold);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  }
  .divider svg { width: 12px; height: 12px; fill: var(--gold); }
  .sub {
    font-weight: 400;
    font-size: clamp(.72rem, 2.6vw, .9rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .photo {
    margin: 38px auto 0;
    width: min(320px, 82vw);
  }
  .photo .frame {
    padding: 8px;
    border: 1px solid var(--gold-soft);
    border-radius: 999px 999px 18px 18px;
    background: #fffaf3;
    box-shadow: 0 14px 40px -18px rgba(122, 90, 42, .45);
  }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 999px 999px 12px 12px;
  }
  .photo figcaption {
    margin-top: 12px;
    font-family: "Cormorant SC", Georgia, serif;
    font-size: 1.05rem;
    letter-spacing: .06em;
    color: var(--gold);
  }
  .msg {
    margin-top: 26px;
    font-weight: 300;
    font-size: 1.02rem;
    line-height: 1.7;
  }
  .soon {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 22px;
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    font-size: .72rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
  }
  footer {
    margin-top: 40px;
    font-size: .75rem;
    font-weight: 300;
    color: #a88a5e;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes glow {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    main, .emblem::after { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="emblem">
    <img src="logo.webp" width="720" height="782" alt="The Glowing Feather emblem: a woman nuzzling a cockatiel, framed by a golden feather">
  </div>

  <h1>The Glowing Feather</h1>
  <div class="divider" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
  </div>
  <p class="sub">Hand-raised cockatiels</p>

  <figure class="photo">
    <div class="frame">
      <img src="nesting.webp" width="760" height="772" loading="lazy" alt="A lutino cockatiel hen in her nest box with two newly hatched chicks and two eggs">
    </div>
    <figcaption>Fresh from the nest</figcaption>
  </figure>

  <p class="msg">Something's hatching. Our new home on the web is still in the nest &mdash; check back soon.</p>
  <span class="soon">Coming soon</span>

  <footer>&copy; <span id="y">2026</span> The Glowing Feather &middot; theglowingfeather.au</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
